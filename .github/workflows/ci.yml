name: ci
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: mlugg/setup-zig@v2
        with:
          version: 0.13.0
      - name: Install dependencies
        timeout-minutes: 10
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          sudo apt-get -o Acquire::Retries=3 -o Acquire::http::Timeout=30 \
            -o Acquire::https::Timeout=30 update
          sudo apt-get -o Acquire::Retries=3 -o Acquire::http::Timeout=30 \
            -o Acquire::https::Timeout=30 install -y --no-install-recommends \
            clang llvm
      - run: make test
      - run: make lint
      - run: make c-testsuite
      - run: make size
      - run: make differential
      - run: make size-cross
      - run: git clone --depth 1 https://github.com/c-testsuite/c-testsuite.git /tmp/c-testsuite
      - run: python3 scripts/test/c_testsuite_upstream.py --dir /tmp/c-testsuite/tests/single-exec --jobs 4
      - run: make release-artifacts

  # Load-only fuzzing: mutated packages must never crash the loader, which is a
  # boundary `ci_vm_load_package` guarantees unconditionally. This target has no
  # fault tolerance, so a regression fails the job.
  #
  # The execute-level targets (fuzz-exec, fuzz-bytecode, fuzz-ffi-exec,
  # fuzz-capi-asan, fuzz-sanitizer) are deliberately not run here. Mutated
  # bytecode may legitimately carry arbitrary addresses or form infinite loops,
  # so those targets only stay green with --tolerate-faults/--tolerate-timeouts
  # and cannot regress today. Run them locally while investigating.
  fuzz:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        seed: [1, 2]
    env:
      FUZZ_SEED: ${{ matrix.seed }}
    steps:
      - uses: actions/checkout@v4
      - uses: mlugg/setup-zig@v2
        with:
          version: 0.13.0
      - name: Install dependencies
        timeout-minutes: 10
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          sudo apt-get -o Acquire::Retries=3 -o Acquire::http::Timeout=30 \
            -o Acquire::https::Timeout=30 update
          sudo apt-get -o Acquire::Retries=3 -o Acquire::http::Timeout=30 \
            -o Acquire::https::Timeout=30 install -y --no-install-recommends \
            clang
      - name: fuzz seed ${{ matrix.seed }}
        run: make fuzz
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: fuzz-artifacts-seed-${{ matrix.seed }}
          path: build/fuzz-artifacts
          if-no-files-found: ignore

  windows-smoke:
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: mlugg/setup-zig@v2
        with:
          version: 0.13.0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: choco install llvm --no-progress -y
      - shell: pwsh
        run: |
          $env:PATH = "C:\Program Files\LLVM\bin;$env:PATH"
          cd compiler
          zig build
          cd ..
          cd runtime
          zig build -Dtarget=x86_64-windows-gnu -Doptimize=ReleaseSmall
          cd ..
          New-Item -ItemType Directory -Force -Path build | Out-Null
          ./compiler/zig-out/bin/cinterp-cc.exe compile examples/basics/hello.c --target x86_64-windows -o build/hello-win64.cib
          $out = & runtime/zig-out/bin/cinterp-run.exe build/hello-win64.cib 2>&1
          $out
          if (-not ($out -match 'result: 42')) { exit 1 }

  arm64-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: mlugg/setup-zig@v2
        with:
          version: 0.13.0
      - name: Install ARM64 toolchain
        timeout-minutes: 15
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          sudo apt-get -o Acquire::Retries=3 -o Acquire::http::Timeout=30 \
            -o Acquire::https::Timeout=30 update
          sudo apt-get -o Acquire::Retries=3 -o Acquire::http::Timeout=30 \
            -o Acquire::https::Timeout=30 install -y --no-install-recommends \
            qemu-user gcc-aarch64-linux-gnu
      - run: |
          cd compiler
          zig build
          cd ..
          cd runtime
          zig build -Dtarget=aarch64-linux-gnu -Doptimize=ReleaseSmall
          cd ..
          mkdir -p build
          ./compiler/zig-out/bin/cinterp-cc compile --target aarch64-linux examples/basics/hello.c -o build/hello-arm64.cib
          qemu-aarch64 -L /usr/aarch64-linux-gnu runtime/zig-out/bin/cinterp-run build/hello-arm64.cib 2>&1 | grep 'result: 42'
