name: ci
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: mlugg/setup-zig@v2
        with:
          version: 0.13.0
      - run: sudo apt-get update && sudo apt-get install -y clang llvm python3 make
      - run: make test
      - run: make lint
      - run: make c-testsuite
      - run: make size
      - run: make runtime
      - run: make differential
      - run: make size-cross
      - run: git clone --depth 1 https://github.com/c-testsuite/c-testsuite.git /tmp/c-testsuite
      - run: python3 scripts/test/c_testsuite_upstream.py --dir /tmp/c-testsuite/tests/single-exec --jobs 4
      - name: cross-compile runtime
        run: |
          cd runtime
          zig build -Dtarget=x86_64-windows-gnu
          zig build -Dtarget=x86-windows-gnu
          zig build -Dtarget=aarch64-linux-gnu
      - run: make release-artifacts

  # Fuzzing runs once per seed so a lucky seed cannot hide a crash; crash and
  # timeout candidates land in build/fuzz-artifacts and are uploaded even on
  # failure. Mutated bytecode can legitimately form infinite loops, so the
  # standard targets tolerate timeouts but count and save them; crashes remain
  # hard failures. Run the scripts without --tolerate-timeouts for strict mode.
  fuzz:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        seed: [1, 2]
    env:
      FUZZ_SEED: ${{ matrix.seed }}
    steps:
      - uses: actions/checkout@v4
      - uses: mlugg/setup-zig@v2
        with:
          version: 0.13.0
      - run: sudo apt-get update && sudo apt-get install -y clang python3 make
      - name: fuzz seed ${{ matrix.seed }}
        run: |
          make fuzz
          make fuzz-exec
          make fuzz-bytecode
          make fuzz-ffi-exec
          make fuzz-capi-asan
          make fuzz-sanitizer
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: fuzz-artifacts-seed-${{ matrix.seed }}
          path: build/fuzz-artifacts
          if-no-files-found: ignore

  windows-smoke:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: mlugg/setup-zig@v2
        with:
          version: 0.13.0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: choco install llvm --no-progress -y
      - shell: pwsh
        run: |
          $env:PATH = "C:\Program Files\LLVM\bin;$env:PATH"
          cd compiler
          zig build
          cd ..
          cd runtime
          zig build -Dtarget=x86_64-windows-gnu -Doptimize=ReleaseSmall
          cd ..
          ./compiler/zig-out/bin/cinterp-cc.exe compile examples/basics/hello.c --target x86_64-windows -o build/hello-win64.cib
          $out = & runtime/zig-out/bin/cinterp-run.exe build/hello-win64.cib 2>&1
          $out
          if (-not ($out -match 'result: 42')) { exit 1 }

  arm64-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: mlugg/setup-zig@v2
        with:
          version: 0.13.0
      - run: sudo apt-get update && sudo apt-get install -y clang python3 make qemu-user gcc-aarch64-linux-gnu
      - run: |
          cd compiler
          zig build
          cd ..
          cd runtime
          zig build -Dtarget=aarch64-linux-gnu -Doptimize=ReleaseSmall
          cd ..
          ./compiler/zig-out/bin/cinterp-cc compile --target aarch64-linux examples/basics/hello.c -o build/hello-arm64.cib
          qemu-aarch64 -L /usr/aarch64-linux-gnu runtime/zig-out/bin/cinterp-run build/hello-arm64.cib | grep 'result: 42'
