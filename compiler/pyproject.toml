[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "cinterp"
dynamic = ["version"]
description = "Build-time C-to-bytecode compiler for the cinterp VM"
requires-python = ">=3.10"
dependencies = []

[tool.setuptools.dynamic]
version = {attr = "cinterp.__version__"}

[project.scripts]
cinterp = "cinterp.cli:main"

[tool.setuptools]
license-files = ["../LICENSE"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
cinterp = ["link/*.json", "link/*.json.gz"]
